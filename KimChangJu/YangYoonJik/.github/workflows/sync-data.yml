name: 서울시 데이터 동기화
on:
  workflow_dispatch:
    inputs:
      quarter:
        description: '동기화할 분기(예: 20254, 비우면 전체)'
        required: false
        type: string
  schedule:
    - cron: '20 2 15 1,4,7,10 *'
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: 서울시 API 수집·분석·저장
        env:
          SEOUL_OPEN_API_KEY: ${{ secrets.SEOUL_OPEN_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TARGET_DISTRICT: 송파구
        run: python -m scripts.sync_seoul_data ${{ inputs.quarter && format('--quarter {0}', inputs.quarter) || '' }}
